version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hrm_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-hrm_db}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer
    container_name: hrm_adminer_prod
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  redis:
    image: redis:alpine
    container_name: hrm_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data

  backend:
    build: ./Backend
    container_name: hrm_backend_prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hrm_db?useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-123456}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - mysql
      - redis

  frontend:
    build: ./Frontend
    container_name: hrm_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data_prod:
  redis_data_prod:
