version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hrm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-hrm_db}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # adminer: (Tuỳ chọn) Giao diện quản lý DB trên nền web
  adminer:
    image: adminer
    container_name: hrm_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  # redis: Database in-memory hỗ trợ message broker / cache
  redis:
    image: redis:alpine
    container_name: hrm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
